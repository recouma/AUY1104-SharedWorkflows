name: "Reusable: Deploy Blue-Green K3s"

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
    secrets:
      EC2_SSH_KEY:
        required: true
      EC2_HOST:
        required: true

jobs:
  deploy-bluegreen:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/k3s-key.pem
          chmod 400 ~/.ssh/k3s-key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Determine active color
        id: color
        run: |
          ACTIVE=$(ssh -i ~/.ssh/k3s-key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=10 ubuntu@${{ secrets.EC2_HOST }} "kubectl get svc orders-svc -o jsonpath='{.spec.selector.version}'" 2>/dev/null || echo "blue")
          echo "Active: $ACTIVE"
          if [ "$ACTIVE" = "blue" ]; then
            echo "target=green" >> $GITHUB_OUTPUT
            echo "active=blue" >> $GITHUB_OUTPUT
          else
            echo "target=blue" >> $GITHUB_OUTPUT
            echo "active=green" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to inactive environment
        id: deploy
        run: |
          SSH="ssh -T -i ~/.ssh/k3s-key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=10 ubuntu@${{ secrets.EC2_HOST }}"
          TARGET=${{ steps.color.outputs.target }}
          echo "Deploying ${{ inputs.image_name }}:${{ inputs.image_tag }} to $TARGET"
          $SSH "kubectl set image deployment/orders-$TARGET orders=${{ inputs.image_name }}:${{ inputs.image_tag }}"
          $SSH "kubectl scale deployment/orders-$TARGET --replicas=2"
          $SSH "kubectl rollout status deployment/orders-$TARGET --timeout=60s"

      - name: Health check on target pods
        run: |
          SSH="ssh -T -i ~/.ssh/k3s-key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=10 ubuntu@${{ secrets.EC2_HOST }}"
          TARGET=${{ steps.color.outputs.target }}
          echo "Running health check on $TARGET pods..."
          for i in 1 2 3 4 5; do
            RESULT=$($SSH "curl -s -o /dev/null -w '%{http_code}' http://\$(kubectl get pods -l app=orders,version=$TARGET -o jsonpath='{.items[0].status.podIP}'):3000/health")
            echo "Attempt $i: HTTP $RESULT"
            if [ "$RESULT" = "200" ]; then
              echo "Health check PASSED"
              exit 0
            fi
            sleep 5
          done
          echo "Health check FAILED"
          exit 1

      - name: Switch traffic to target
        if: success()
        run: |
          SSH="ssh -T -i ~/.ssh/k3s-key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=10 ubuntu@${{ secrets.EC2_HOST }}"
          TARGET=${{ steps.color.outputs.target }}
          ACTIVE=${{ steps.color.outputs.active }}
          echo "=== Switching traffic: $ACTIVE -> $TARGET ==="
          $SSH "kubectl patch svc orders-svc -p '{\"spec\":{\"selector\":{\"version\":\"$TARGET\"}}}'"
          echo "=== Scaling down $ACTIVE ==="
          $SSH "kubectl scale deployment/orders-$ACTIVE --replicas=0"
          echo "=== Verificacion final ==="
          $SSH "kubectl get pods -l app=orders"
          $SSH "kubectl get svc orders-svc -o jsonpath='{.spec.selector}'"
          $SSH "curl -s http://localhost:30090/health"

      - name: Rollback automatico
        if: failure()
        run: |
          SSH="ssh -T -i ~/.ssh/k3s-key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=10 ubuntu@${{ secrets.EC2_HOST }}"
          TARGET=${{ steps.color.outputs.target }}
          ACTIVE=${{ steps.color.outputs.active }}
          echo "=== ROLLBACK: Revirtiendo deploy fallido ==="
          $SSH "kubectl scale deployment/orders-$TARGET --replicas=0" || true
          echo "=== Service sigue apuntando a $ACTIVE ==="
          $SSH "kubectl get svc orders-svc -o jsonpath='{.spec.selector}'" || true
          $SSH "kubectl get pods -l app=orders" || true
          $SSH "curl -s http://localhost:30090/health" || true
          echo "=== Rollback completado ==="
