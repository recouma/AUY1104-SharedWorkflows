name: "Reusable: Deploy Blue-Green K3s"

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
    secrets:
      EC2_SSH_KEY:
        required: true
      EC2_HOST:
        required: true

jobs:
  deploy-bluegreen:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/k3s-key.pem
          chmod 400 ~/.ssh/k3s-key.pem
          cat >> ~/.ssh/config << EOF
          Host k3s-server
            HostName ${{ secrets.EC2_HOST }}
            User ubuntu
            IdentityFile ~/.ssh/k3s-key.pem
            StrictHostKeyChecking no
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 3
          EOF

      - name: Deploy Blue-Green
        id: deploy
        run: |
          ssh k3s-server << 'REMOTESCRIPT'
            set -e
            echo "=== Determinando color activo ==="
            ACTIVE=$(kubectl get svc orders-svc -o jsonpath='{.spec.selector.version}' 2>/dev/null || echo "blue")
            echo "Active: $ACTIVE"
            if [ "$ACTIVE" = "blue" ]; then TARGET="green"; else TARGET="blue"; fi
            echo "Target: $TARGET"

            echo "=== Desplegando a $TARGET ==="
            kubectl set image deployment/orders-$TARGET orders=${{ inputs.image_name }}:${{ inputs.image_tag }}
            kubectl scale deployment/orders-$TARGET --replicas=2
            kubectl rollout status deployment/orders-$TARGET --timeout=60s

            echo "=== Health check ==="
            sleep 5
            POD_IP=$(kubectl get pods -l app=orders,version=$TARGET -o jsonpath='{.items[0].status.podIP}')
            echo "Pod IP: $POD_IP"
            for i in 1 2 3 4 5; do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' http://$POD_IP:3000/health 2>/dev/null || echo "000")
              echo "Intento $i: HTTP $CODE"
              if [ "$CODE" = "200" ]; then
                echo "Health check PASSED"
                
                echo "=== Switching traffic: $ACTIVE -> $TARGET ==="
                kubectl patch svc orders-svc -p "{\"spec\":{\"selector\":{\"version\":\"$TARGET\"}}}"
                kubectl scale deployment/orders-$ACTIVE --replicas=0
                
                echo "=== Verificacion final ==="
                kubectl get pods -l app=orders
                kubectl get svc orders-svc -o jsonpath='{.spec.selector}' && echo
                curl -s http://localhost:30090/health && echo
                echo "=== Deploy exitoso ==="
                exit 0
              fi
              sleep 3
            done

            echo "=== Health check FAILED - Ejecutando rollback ==="
            kubectl scale deployment/orders-$TARGET --replicas=0
            echo "Service sigue apuntando a $ACTIVE"
            kubectl get pods -l app=orders
            curl -s http://localhost:30090/health && echo
            echo "=== Rollback completado ==="
            exit 1
          REMOTESCRIPT

      - name: Rollback on pipeline failure
        if: failure()
        run: |
          ssh k3s-server "kubectl scale deployment/orders-green --replicas=0 2>/dev/null; kubectl scale deployment/orders-blue --replicas=0 2>/dev/null; ACTIVE=\$(kubectl get svc orders-svc -o jsonpath='{.spec.selector.version}'); kubectl scale deployment/orders-\$ACTIVE --replicas=2; echo 'Rollback de emergencia completado'" || echo "No se pudo conectar para rollback"
