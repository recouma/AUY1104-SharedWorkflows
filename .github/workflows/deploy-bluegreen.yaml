name: "Reusable: Deploy Blue-Green K3s"

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
    secrets:
      KUBECONFIG_DATA:
        required: true

jobs:
  deploy-bluegreen:
    runs-on: ubuntu-latest
    steps:
      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connection
        run: kubectl get nodes

      - name: Determine active color
        id: color
        run: |
          ACTIVE=$(kubectl get svc orders-svc -o jsonpath='{.spec.selector.version}' 2>/dev/null || echo "blue")
          echo "Active: $ACTIVE"
          if [ "$ACTIVE" = "blue" ]; then
            echo "target=green" >> $GITHUB_OUTPUT
            echo "active=blue" >> $GITHUB_OUTPUT
          else
            echo "target=blue" >> $GITHUB_OUTPUT
            echo "active=green" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to inactive environment
        run: |
          TARGET=${{ steps.color.outputs.target }}
          echo "Deploying ${{ inputs.image_name }}:${{ inputs.image_tag }} to $TARGET"
          kubectl set image deployment/orders-$TARGET orders=${{ inputs.image_name }}:${{ inputs.image_tag }}
          kubectl scale deployment/orders-$TARGET --replicas=2
          kubectl rollout status deployment/orders-$TARGET --timeout=60s

      - name: Health check on target pods
        run: |
          TARGET=${{ steps.color.outputs.target }}
          echo "Running health check on $TARGET pods..."
          sleep 5
          POD_IP=$(kubectl get pods -l app=orders,version=$TARGET -o jsonpath='{.items[0].status.podIP}')
          echo "Pod IP: $POD_IP"
          kubectl run healthcheck-$TARGET --image=curlimages/curl --restart=Never --rm -i --timeout=30s -- curl -sf http://$POD_IP:3000/health
          echo "Health check PASSED"

      - name: Switch traffic to target
        if: success()
        run: |
          TARGET=${{ steps.color.outputs.target }}
          ACTIVE=${{ steps.color.outputs.active }}
          echo "=== Switching traffic: $ACTIVE -> $TARGET ==="
          kubectl patch svc orders-svc -p "{\"spec\":{\"selector\":{\"version\":\"$TARGET\"}}}"
          echo "=== Scaling down $ACTIVE ==="
          kubectl scale deployment/orders-$ACTIVE --replicas=0
          echo "=== Verificacion final ==="
          kubectl get pods -l app=orders
          kubectl get svc orders-svc -o jsonpath='{.spec.selector}' && echo
          echo "=== Deploy Blue-Green exitoso ==="

      - name: Rollback automatico
        if: failure()
        run: |
          TARGET=${{ steps.color.outputs.target }}
          ACTIVE=${{ steps.color.outputs.active }}
          echo "=== ROLLBACK: Revirtiendo deploy fallido ==="
          kubectl scale deployment/orders-$TARGET --replicas=0 || true
          kubectl scale deployment/orders-$ACTIVE --replicas=2 || true
          echo "=== Service sigue apuntando a $ACTIVE ==="
          kubectl get svc orders-svc -o jsonpath='{.spec.selector}' && echo
          kubectl get pods -l app=orders
          echo "=== Rollback completado ==="
